<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterOcampo logo preview</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 48px 24px 80px;
        background: #f3f5f8;
        color: #0f172a;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 32px;
        color: #475569;
        max-width: 52rem;
        line-height: 1.5;
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }
      .card {
        border-radius: 16px;
        padding: 28px;
        background: #fff;
        border: 1px solid #e2e8f0;
      }
      .card.dark {
        background: #005df5;
        border-color: #005df5;
      }
      .card h2 {
        margin: 0 0 16px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #64748b;
      }
      .card.dark h2 {
        color: #dbeafe;
      }
      .sizes {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
      }
      .sizes img {
        display: block;
      }
      .icon {
        width: 160px;
        height: 160px;
        object-fit: contain;
      }
      .label {
        font-size: 12px;
        color: #64748b;
        margin-top: 8px;
      }
      .card.dark .label {
        color: #bfdbfe;
      }
    </style>
  </head>
  <body>
    <h1>BetterOcampo logo</h1>
    <p>
      Official site mark: circular blue/white seal with Mt. Isarog, Philippine
      sun, sugarcane, fields, and 1949.
    </p>

    <div class="grid">
      <div class="card">
        <h2>On light</h2>
        <div class="sizes">
          <img class="icon" src="./png/BetterOcampo-Seal.png" alt="BetterOcampo" />
          <img src="./png/BetterOcampo-Seal.png" width="64" height="64" alt="" />
          <img src="./png/BetterOcampo-Seal.png" width="40" height="40" alt="" />
          <img src="./png/BetterOcampo-Seal.png" width="24" height="24" alt="" />
        </div>
      </div>

      <div class="card dark">
        <h2>On Kapwa blue</h2>
        <img class="icon" src="./png/BetterOcampo-Seal.png" alt="BetterOcampo" />
        <div class="label">Navbar / modal contexts</div>
      </div>
    </div>
  </body>
</html>
