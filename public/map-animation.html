<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hairline Figure — Animated 2D Map</title>
    <style>
      :root {
        --hairline-plate: #ffffff;
        --hairline-hi: #2563eb;
        --hairline-edge: #1d4ed8;
        --hairline-mid: #64748b;
        --hairline-lo: #cbd5e1;
        --hairline-stroke: 1.5;
        --bg-page: #f8fafc;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --panel-bg: rgba(255, 255, 255, 0.92);
        --panel-border: rgba(15, 23, 42, 0.1);
      }

      [data-theme='dark'] {
        --hairline-plate: #0f172a;
        --hairline-hi: #38bdf8;
        --hairline-edge: #60a5fa;
        --hairline-mid: #94a3b8;
        --hairline-lo: #1e293b;
        --bg-page: #020617;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --panel-bg: rgba(15, 23, 42, 0.92);
        --panel-border: rgba(248, 250, 252, 0.14);
      }

      @media (prefers-color-scheme: dark) {
        [data-theme='auto'] {
          --hairline-plate: #0f172a;
          --hairline-hi: #38bdf8;
          --hairline-edge: #60a5fa;
          --hairline-mid: #94a3b8;
          --hairline-lo: #1e293b;
          --bg-page: #020617;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --panel-bg: rgba(15, 23, 42, 0.92);
          --panel-border: rgba(248, 250, 252, 0.14);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        transition:
          background-color 0.25s ease,
          color 0.25s ease;
      }

      .hairline-figure {
        position: relative;
        width: 100%;
        max-width: 980px;
        background: var(--hairline-plate);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        box-shadow: 0 18px 40px -15px rgba(15, 23, 42, 0.12);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .canvas-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 1024 / 537;
        min-height: 360px;
        cursor: pointer;
        touch-action: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .figure-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 12px 20px;
        border-top: 1px solid var(--panel-border);
        background: var(--panel-bg);
        backdrop-filter: blur(8px);
        z-index: 10;
      }

      .control-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .control-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 130px;
        height: 4px;
        background: var(--hairline-lo);
        border-radius: 999px;
        outline: none;
        cursor: pointer;
      }

      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--hairline-hi);
        border: 2px solid var(--hairline-plate);
        box-shadow: 0 0 0 1px var(--hairline-hi);
        cursor: pointer;
        transition: transform 0.15s ease;
      }

      input[type='range']::-webkit-slider-thumb:hover {
        transform: scale(1.15);
      }

      .intensity-val {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        color: var(--text-main);
        min-width: 34px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-main);
        background: var(--hairline-plate);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          background-color 0.2s ease,
          color 0.2s ease;
      }

      .btn:hover {
        border-color: var(--hairline-hi);
      }

      .btn[aria-pressed='true'] {
        border-color: var(--hairline-hi);
        color: var(--hairline-hi);
      }

      .theme-pills {
        display: inline-flex;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        overflow: hidden;
      }

      .theme-btn {
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 600;
        background: transparent;
        color: var(--text-muted);
        border: none;
        border-right: 1px solid var(--panel-border);
        cursor: pointer;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      .theme-btn:last-child {
        border-right: none;
      }

      .theme-btn.active {
        background: var(--hairline-hi);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <figure
      class="hairline-figure"
      id="hairlineFigure"
      aria-label="Animated 2D Territory Map"
    >
      <div
        class="canvas-stage"
        id="canvasStage"
        tabindex="0"
        aria-label="Animated 2D territory map canvas"
      >
        <canvas id="hairlineCanvas"></canvas>
      </div>

      <div class="figure-controls">
        <div class="control-group">
          <label class="control-label" for="intensitySlider">Hover Lift</label>
          <input
            type="range"
            id="intensitySlider"
            min="0"
            max="1"
            step="0.01"
            value="0.55"
          />
          <span class="intensity-val" id="intensityVal">0.55</span>
        </div>

        <div class="control-group">
          <button type="button" class="btn" id="playToggle" aria-pressed="true">
            <span id="playIcon">❚❚</span>
            <span id="playLabel">Pause</span>
          </button>

          <div class="theme-pills" role="group" aria-label="Color theme">
            <button
              type="button"
              class="theme-btn active"
              data-theme-val="light"
            >
              Light
            </button>
            <button type="button" class="theme-btn" data-theme-val="dark">
              Dark
            </button>
            <button type="button" class="theme-btn" data-theme-val="auto">
              Auto
            </button>
          </div>
        </div>
      </div>
    </figure>

            id: 'territory-23',
            phase: 5.701,
          },
        ];

        regions.forEach(r => {
          r.currentLift = 0;
          r.screenPoly = [];
          r.basePoly = [];
        });

        function getTokens() {
          const styles = getComputedStyle(figure);
          return {
            plate:
              styles.getPropertyValue('--hairline-plate').trim() || '#ffffff',
            hi: styles.getPropertyValue('--hairline-hi').trim() || '#2563eb',
            edge:
              styles.getPropertyValue('--hairline-edge').trim() || '#1d4ed8',
            mid: styles.getPropertyValue('--hairline-mid').trim() || '#64748b',
            lo: styles.getPropertyValue('--hairline-lo').trim() || '#cbd5e1',
            stroke:
              parseFloat(styles.getPropertyValue('--hairline-stroke')) || 1.5,
          };
        }

        function isDarkMode() {
          const theme = document.documentElement.getAttribute('data-theme');
          if (theme === 'dark') return true;
          if (
            theme === 'auto' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          )
            return true;
          return false;
        }

        function pointInPolygon(px, py, poly) {
          let inside = false;
          for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            const xi = poly[i].x,
              yi = poly[i].y;
            const xj = poly[j].x,
              yj = poly[j].y;
            const intersect =
              yi > py !== yj > py &&
              px < ((xj - xi) * (py - yi)) / (yj - yi || 1e-9) + xi;
            if (intersect) inside = !inside;
          }
          return inside;
        }

        function resizeCanvas() {
          const rect = stage.getBoundingClientRect();
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.max(1, Math.floor(rect.width * dpr));
          canvas.height = Math.max(1, Math.floor(rect.height * dpr));
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function syncPlayButton() {
          playToggle.setAttribute('aria-pressed', String(isPlaying));
          playIcon.textContent = isPlaying ? '❚❚' : '▶';
          playLabel.textContent = isPlaying ? 'Pause' : 'Play';
        }

        intensitySlider.addEventListener('input', e => {
          intensity = sanitizeIntensity(e.target.value);
          intensityVal.textContent = intensity.toFixed(2);
        });

        playToggle.addEventListener('click', () => {
          isPlaying = !isPlaying;
          if (isPlaying) {
            pointerActive = false;
            focusedIndex = -1;
          }
          syncPlayButton();
        });

        themeBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const mode = btn.getAttribute('data-theme-val');
            document.documentElement.setAttribute('data-theme', mode);
            themeBtns.forEach(b => b.classList.toggle('active', b === btn));
          });
        });

        reducedMotionQuery.addEventListener('change', e => {
          prefersReducedMotion = e.matches;
          if (prefersReducedMotion) {
            isPlaying = false;
            syncPlayButton();
          }
        });

        stage.addEventListener('pointermove', e => {
          const rect = stage.getBoundingClientRect();
          pointerPos.x = e.clientX - rect.left;
          pointerPos.y = e.clientY - rect.top;
          pointerActive = true;
        });

        stage.addEventListener('pointerleave', () => {
          pointerActive = false;
          pointerPos = { x: -9999, y: -9999 };
        });

        stage.addEventListener('keydown', e => {
          if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            focusedIndex = (focusedIndex + 1) % regions.length;
          } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            focusedIndex = (focusedIndex - 1 + regions.length) % regions.length;
          } else if (e.key === 'Escape') {
            focusedIndex = -1;
          }
        });

        stage.addEventListener('blur', () => {
          focusedIndex = -1;
        });

        function drawSubtleGrid(width, height, tokens) {
          ctx.save();
          ctx.strokeStyle = tokens.lo;
          ctx.globalAlpha = 0.4;
          ctx.lineWidth = 0.75;
          ctx.setLineDash([2, 4]);
          const step = Math.max(28, Math.round(width / 24));
          for (let x = step; x < width; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, height);
            ctx.stroke();
          }
          for (let y = step; y < height; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
            ctx.stroke();
          }
          ctx.restore();
        }

        function getRegionFill(rgb, isActive, dark) {
          let [r, g, b] = rgb;
          if (dark) {
            r = Math.round(r * 0.24 + (isActive ? 22 : 8));
            g = Math.round(g * 0.42 + (isActive ? 45 : 18));
            b = Math.round(b * 0.68 + (isActive ? 55 : 28));
          } else if (isActive) {
            r = Math.max(45, r - 22);
            g = Math.max(95, g - 14);
            b = Math.min(255, b + 8);
          }
          return `rgb(${r}, ${g}, ${b})`;
        }

        function render(timestamp) {
          if (!lastTimestamp) lastTimestamp = timestamp;
          const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
          lastTimestamp = timestamp;

          const rect = stage.getBoundingClientRect();
          const width = rect.width;
          const height = rect.height;
          const tokens = getTokens();
          const dark = isDarkMode();

          const focusedRegion =
            focusedIndex >= 0 ? regions[focusedIndex] : null;
          const userInteracting = pointerActive || focusedRegion !== null;

          if (isPlaying && !prefersReducedMotion && !userInteracting) {
            time += dt * 1.75;
          }

          // Hit-test pointer against lifted polygons
          let hoveredRegion = null;
          if (pointerActive) {
            const hitOrder = [...regions].sort(
              (a, b) =>
                b.cy + b.currentLift * 0.01 - (a.cy + a.currentLift * 0.01)
            );
            for (const r of hitOrder) {
              if (
                r.screenPoly.length &&
                pointInPolygon(pointerPos.x, pointerPos.y, r.screenPoly)
              ) {
                hoveredRegion = r;
                break;
              }
            }
          }

          const activeRegion = hoveredRegion || focusedRegion;

          // Vertical 2D hover displacement in pixels
          const maxWavePx = (4 + intensity * 18) * (height / 537);
          const activeBoostPx = (10 + intensity * 24) * (height / 537);

          let highestWave = -1;
          let tourLeader = null;

          regions.forEach(r => {
            const rawWave = (Math.sin(time - r.phase * 1.1) + 1) * 0.5;
            const smoothWave = rawWave * rawWave * (3 - 2 * rawWave);

            if (smoothWave > highestWave) {
              highestWave = smoothWave;
              tourLeader = r;
            }

            let targetLift = prefersReducedMotion ? 0 : smoothWave * maxWavePx;
            if (activeRegion && activeRegion.id === r.id) {
              targetLift = Math.max(targetLift, activeBoostPx);
            }

            const stiffness = 1 - Math.exp(-11 * dt);
            r.currentLift += (targetLift - r.currentLift) * stiffness;

            r.basePoly = r.pts.map(([nx, ny]) => ({
              x: nx * width,
              y: ny * height,
            }));
            r.screenPoly = r.pts.map(([nx, ny]) => ({
              x: nx * width,
              y: ny * height - r.currentLift,
            }));
          });

          const highlightedRegion =
            activeRegion ||
            (isPlaying && !prefersReducedMotion ? tourLeader : null);

          ctx.clearRect(0, 0, width, height);
          drawSubtleGrid(width, height, tokens);

          // Painter's algorithm sort: back-to-front, with raised/hovered piece on top
          const renderOrder = [...regions].sort((a, b) => {
            const aActive =
              highlightedRegion && highlightedRegion.id === a.id ? 1 : 0;
            const bActive =
              highlightedRegion && highlightedRegion.id === b.id ? 1 : 0;
            if (aActive !== bActive) return aActive - bActive;
            return (
              a.cy - a.currentLift * 0.002 - (b.cy - b.currentLift * 0.002)
            );
          });

          // Pass 1: Recessed 2D footprint outlines for hovering parts
          renderOrder.forEach(r => {
            if (r.currentLift > 0.8) {
              ctx.save();
              ctx.beginPath();
              r.basePoly.forEach((p, idx) =>
                idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)
              );
              ctx.closePath();
              ctx.fillStyle = dark
                ? 'rgba(2, 6, 23, 0.55)'
                : 'rgba(29, 78, 216, 0.08)';
              ctx.fill();
              ctx.strokeStyle = tokens.lo;
              ctx.lineWidth = 1;
              ctx.setLineDash([2, 2]);
              ctx.stroke();
              ctx.restore();
            }
          });

          // Pass 2: Draw the 2D blue territories hovering upward with crisp borders
          renderOrder.forEach(r => {
            const isActive = highlightedRegion && highlightedRegion.id === r.id;

            ctx.save();
            if (r.currentLift > 0.8) {
              ctx.shadowColor = dark
                ? 'rgba(0, 0, 0, 0.55)'
                : 'rgba(15, 23, 42, 0.18)';
              ctx.shadowBlur = 4 + r.currentLift * 0.7;
              ctx.shadowOffsetY = Math.max(2, r.currentLift * 0.45);
            }

            ctx.beginPath();
            r.screenPoly.forEach((p, idx) =>
              idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y)
            );
            ctx.closePath();

            ctx.fillStyle = getRegionFill(r.rgb, isActive, dark);
            ctx.fill();

            ctx.shadowColor = 'transparent';
            ctx.strokeStyle = isActive ? tokens.hi : tokens.edge;
            ctx.lineWidth = isActive
              ? tokens.stroke * 1.55
              : tokens.stroke * 1.15;
            ctx.lineJoin = 'round';
            ctx.stroke();
            ctx.restore();
          });

          requestAnimationFrame(render);
        }

        syncPlayButton();
        requestAnimationFrame(render);
      })();
